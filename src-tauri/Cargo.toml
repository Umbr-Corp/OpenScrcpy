[package]
name = "openscrcpy"
version = "1.1.7"
authors = ["yanhenrique-dev"]
description = "A modern desktop GUI for controlling Android devices"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "open_scrcpy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
zip = "8.1.0"
flate2 = "1.0"
tar = "0.4"
# Verify the scrcpy release archive against SHA256SUMS.txt before extracting.
sha2 = "0.10"
tokio = { version = "1.49.0", features = ["full"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.0"
chrono = "0.4.43"
# Global OS shortcuts: Ctrl+Alt+Shift+C to recentre the active mirror window
# (all platforms) and Ctrl+Alt+Shift+W to drag the borderless scrcpy window
# with the mouse (Windows-only). See src/shortcuts.rs and src/grab.rs.
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
# Two app windows share the same scrcpy-bin staging paths; one instance only
# is also one adb poller and one updater.
tauri-plugin-single-instance = "2.5.4"

# Windows-only: read the scrcpy mirror window's client-area position natively
# (EnumWindows + ClientToScreen) to persist it across sessions. Pinned to the
# 0.61 line already resolved transitively by tao/wry, so Cargo unifies onto a
# single compiled copy (no duplicate `windows` version).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
