name: Release CI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    env:
      PKG_CONFIG_ALLOW_CROSS: 1
      # linuxdeploy's bundled strip cannot handle the .relr.dyn sections the
      # current linker emits; skipping the strip step keeps the AppImage
      # bundling from failing. (Cost: a slightly larger binary.)
      NO_STRIP: 1
      # The updater plugin refuses unsigned bundles: sign the artifacts
      # so latest.json + .sig files land on the release (in-app updates).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # Key generated with an empty password; the env still must exist.
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          source "$HOME/.cargo/env"

      - name: Add macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ matrix.platform }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ matrix.platform }}-

      - name: Install Linux dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Collect artifacts
        run: node scripts/collect-artifacts.mjs

      - name: Publish assets
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs upload artifacts

  # The updater polls a file on the default branch, not the release assets:
  # Forgejo has no "latest/download" alias the way GitHub does. This job
  # rebuilds updater/latest.json from the published assets and pushes it.
  manifest:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish updater manifest
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs manifest
