name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }} # Use a PAT to allow triggering other workflows

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Git Config
        run: |
          git config --global user.name "forgejo-actions[bot]"
          git config --global user.email "forgejo-actions[bot]@users.noreply.forgejo.org"

      - name: Bump package.json version
        run: |
          npm version ${{ inputs.bump_type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update tauri.conf.json
        run: |
          # Use jq to update version in tauri.conf.json
          jq ".version = \"${{ env.NEW_VERSION }}\"" src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp && mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - name: Update Cargo.toml
        run: |
          # Use sed to update version in Cargo.toml [package] section
          sed -i "s/^version = \".*\"/version = \"${{ env.NEW_VERSION }}\"/" src-tauri/Cargo.toml

      - name: Create Pull Request
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NEW_VERSION: ${{ env.NEW_VERSION }}
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          BRANCH="chore/version-bump-v${NEW_VERSION}"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore: bump version to v${NEW_VERSION}"
          git push origin "$BRANCH"

          # Both GitHub and Forgejo create a pull request through the same
          # POST /repos/{owner}/{repo}/pulls route.
          PAYLOAD=$(jq -n \
            --arg title "chore: bump version to v${NEW_VERSION}" \
            --arg head "$BRANCH" \
            --arg base "main" \
            --arg body "Bumping version to v${NEW_VERSION}
- Bump type: ${BUMP_TYPE}
- Updated: package.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml" \
            '{title: $title, head: $head, base: $base, body: $body}')

          curl -sS -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls" \
            | jq -r '.html_url // .message'
